# Server Port
server.port=8080

# Spring Data MongoDB Configuration
# Connection URI read dynamically from MONGODB_URI environment variable (Atlas or Local fallback)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/foodrescue}

# Enable Automatic Creation of MongoDB Indexes (2dsphere, unique email, compound indexes)
spring.data.mongodb.auto-index-creation=true

# Pretty print JSON responses
spring.jackson.serialization.indent_output=true

# Logging Level
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
