# Server Port
server.port=8080

# Spring Data MongoDB Configuration
spring.data.mongodb.uri=mongodb+srv://foodrescue_admin:${MONGODB_PASSWORD}@cluster0.rvzejou.mongodb.net/foodrescue?retryWrites=true&w=majority

# Enable Automatic Creation of MongoDB Indexes (2dsphere, unique email, compound indexes)
spring.data.mongodb.auto-index-creation=true

# Pretty print JSON responses
spring.jackson.serialization.indent_output=true

# Logging Level
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# JWT and Security Settings
app.jwt.expiration-minutes=60
app.cors.allowed-origins=http://localhost:5173
